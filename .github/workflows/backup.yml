# Daily backup of the production database — every patient record and every
# uploaded file (file bytes live in Postgres), with nothing left out.
#
# Runs scripts/backup.sh (pg_dump, then a read-back check), encrypts the dump
# with AES-256 before it leaves the runner, and keeps it as a workflow
# artifact for 30 days. The artifact is ciphertext: without the passphrase it
# is useless to anyone who can see this repository.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DIRECT_DATABASE_URL  Neon's direct (non-pooled) connection string
#   BACKUP_PASSPHRASE    a long random passphrase — keep a copy offline;
#                        a backup nobody can decrypt is not a backup
#
# Restore:
#   gpg --decrypt aadrique-….dump.gpg > aadrique.dump
#   pg_restore --no-owner --dbname "$TARGET_URL" aadrique.dump
#
# Neon also keeps its own point-in-time history; this is the copy that does
# not depend on Neon.
name: Database backup

on:
  schedule:
    # 20:30 UTC = 02:00 IST, after the clinic day.
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DIRECT_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Set the DIRECT_DATABASE_URL and BACKUP_PASSPHRASE repository secrets." >&2
            exit 1
          fi

      - name: Install the Postgres 18 client (Neon runs 18; pg_dump must not be older)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Dump and verify
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: bash scripts/backup.sh backups

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for file in backups/*.dump; do
            gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase-fd 0 --output "$file.gpg" "$file" <<< "$BACKUP_PASSPHRASE"
            shred -u "$file"
          done
          ls -lh backups

      - name: Keep for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: aadrique-backup-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 30
          if-no-files-found: error
